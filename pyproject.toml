[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=84.2.1" ]

[project]
name = "geekbench-browser-python"
version = "1.0.0"
description = "Simple package for getting data from browser.geekbench.com"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.13"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "click",
  "nodriver>=0.50.99",
  "pandas>=3.1.1",
  "py-cpuinfo>=9",
  "rich>=15",
]
urls."Bug Tracker" = "https://github.com/34j/geekbench-browser-python/issues"
urls.Changelog = "https://github.com/34j/geekbench-browser-python/blob/main/CHANGELOG.md"
urls.documentation = "https://geekbench-browser-python.readthedocs.io"
urls.repository = "https://github.com/34j/geekbench-browser-python"
scripts.gbr = "geekbench_browser.__main__:cli"
scripts.geekbench-browser = "geekbench_browser.__main__:cli"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]>=1.1.8",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
